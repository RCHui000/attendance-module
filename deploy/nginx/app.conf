server {
    listen 80;
    server_name xpjs.asia www.xpjs.asia;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://xpjs.asia$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name xpjs.asia www.xpjs.asia;

    ssl_certificate /etc/letsencrypt/live/xpjs.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xpjs.asia/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=15552000" always;

    client_max_body_size 20m;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    resolver 127.0.0.11 valid=30s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /apps/tender {
        return 301 /apps/tender/;
    }

    location /apps/tender/ {
        set $tender_backend tender-app:8000;
        rewrite ^/apps/tender/(.*)$ /$1 break;
        proxy_pass http://$tender_backend;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Prefix /apps/tender;
        proxy_read_timeout 120s;
    }

    location /auth/v1/ {
        proxy_pass http://app:80;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /rest/v1/ {
        proxy_pass http://app:80;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location /auth/ {
        proxy_pass http://app:80;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /rest/ {
        proxy_pass http://postgrest:3000/;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location /realtime/ {
        proxy_pass http://realtime:4000/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://app:80;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
